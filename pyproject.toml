[project]
name = "recursive-agent-harness"
version = "0.1.0"
description = "RAO-style recursive agent inference harness"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "PyYAML>=6",
]

[project.optional-dependencies]
train = [
    "torch>=2.4,<2.5",
    "transformers>=4.51,<5",
    "accelerate>=1,<2",
    "peft>=0.15,<0.20",
    "modelscope>=1.37,<2",
]

test = [
    "pytest>=8",
    "pytest-asyncio>=1",
]

[tool.setuptools.packages.find]
include = [
    "recursive_agent_harness*",
    "recursive_agent_training*",
]
