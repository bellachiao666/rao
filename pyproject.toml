[project]
name = "recursive-agent-harness"
version = "0.1.0"
description = "RAO-style recursive agent inference harness"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
