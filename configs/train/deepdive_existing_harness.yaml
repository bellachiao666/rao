experiment:
  name: deepdive_existing_harness
  seed: 42
  faithful_profile: true
  action_profile: existing_harness

dataset:
  train_path: data/deepdive_qa_rl.csv
  eval_path: ""
  split_manifest_path: output/train/deepdive_split.json
  eval_count: 50

model:
  name: Qwen-3-4B-Instruct-2507
  path: ""
  tokenizer_revision: ""
  train_context_tokens: 40960
  eval_context_tokens: 262144
  dtype: bfloat16
  use_lora: false
  lora_rank: 8
  lora_alpha: 16

rollout:
  root_batch_size: 16
  group_size: 8
  max_depth: 4
  max_steps_per_node: 25
  temperature: 1.0
  max_tokens: 4096
  max_staleness_batches: 3
  max_concurrent_groups: 16

reward:
  lambda: 0.0
  root_provider: llm_judge
  subtask_provider: llm_judge
  train_failed_trajectories: true

advantage:
  type: root_group_leave_one_out

weighting:
  type: depth_inverse_frequency

objective:
  type: cispo
  epsilon_low: 0.2
  epsilon_high: 0.2
  kl_coefficient: 0.0

optimizer:
  backend: areal
  learning_rate: 0.000003
  weight_decay: 0.0
  beta1: 0.9
  beta2: 0.95
  grad_clip_norm: 1.0
  gradient_accumulation_steps: 1

checkpoint:
  output_dir: output/train/deepdive_rao
  save_every_steps: 1

evaluation:
  heldout_task_count: 50
  every_steps: 5

async:
  enabled: true
  rollout_queue_size: 64
  verifier_queue_size: 64
  train_queue_size: 8

parameter_sources:
  rollout.root_batch_size: paper
  rollout.group_size: paper
  rollout.max_depth: paper
  rollout.max_steps_per_node: paper
  rollout.max_staleness_batches: paper
  reward.lambda: paper
  optimizer.learning_rate: paper
  objective.epsilon_low: implementation_choice
  objective.epsilon_high: implementation_choice
  optimizer.beta1: implementation_choice
  optimizer.beta2: implementation_choice
