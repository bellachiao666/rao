experiment:
  name: sync_qwen_0_6b
  seed: 42
  faithful_profile: false
  action_profile: existing_harness

dataset:
  train_path: ""
  eval_path: ""
  split_manifest_path: ""
  eval_count: 4

model:
  name: Qwen3-0.6B
  path: ""
  tokenizer_revision: ""
  train_context_tokens: 4096
  eval_context_tokens: 4096
  dtype: bfloat16
  use_lora: true
  lora_rank: 8
  lora_alpha: 16

rollout:
  root_batch_size: 4
  group_size: 4
  max_depth: 1
  max_steps_per_node: 4
  temperature: 1.2
  max_tokens: 256
  max_staleness_batches: 0
  max_concurrent_groups: 1

reward:
  lambda: 0.0
  root_provider: exact
  subtask_provider: exact
  train_failed_trajectories: true

advantage:
  type: root_group_leave_one_out

weighting:
  type: depth_inverse_frequency

objective:
  type: cispo
  epsilon_low: 0.2
  epsilon_high: 0.2
  kl_coefficient: 0.0

optimizer:
  backend: torch
  learning_rate: 0.0001
  weight_decay: 0.0
  beta1: 0.9
  beta2: 0.95
  grad_clip_norm: 1.0
  gradient_accumulation_steps: 1

checkpoint:
  output_dir: output/train/sync_qwen_0_6b
  save_every_steps: 1

evaluation:
  heldout_task_count: 4
  every_steps: 1

async:
  enabled: false
  rollout_queue_size: 1
  verifier_queue_size: 1
  train_queue_size: 1

sync_flywheel:
  root_tasks_per_round: 4
  target_rounds: 2
  ratio_min: 0.95
  ratio_max: 1.05
  nonzero_advantage_epsilon: 0.00000001

parameter_sources:
  sync_flywheel: implementation_choice
